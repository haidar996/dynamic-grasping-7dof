<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LESSON-ID - TITLE</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#5b5b55; --card:#fff; --line:#e3e1d8; --accent:#1f5f8b; --box:#eef4f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181a; --fg:#ececea; --muted:#a2a29b; --card:#1f2225; --line:#33373b; --accent:#7fb7de; --box:#1b2630; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Naskh Arabic","Amiri","Segoe UI",Tahoma,sans-serif; font-size:20px; line-height:2; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:8px 0 4px; } h2 { font-size:22px; color:var(--accent); margin-top:32px; }
  .tag { color:var(--muted); font-size:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 20px; margin:16px 0; }
  .box { background:var(--box); border-radius:10px; padding:8px 18px; margin:16px 0; }
  .en { direction:ltr; unicode-bidi:isolate; font-family:"Segoe UI",Arial,sans-serif; font-weight:600; }
  li { margin:6px 0; }
</style>
</head>
<body><main>
<p class="tag">الدرس X &middot; الطبقة N: ...</p>
<h1>العنوان</h1>

<div class="box"><p>جواب السؤال السابق: ...  (use &lt;span class='en'&gt;...&lt;/span&gt; for English terms / formulas, LTR)</p></div>

<div class="card"><h2>1. ...</h2>
<p>...</p></div>

<div class="card"><h2>سؤال للتأكد</h2>
<p>...</p></div>
<p class="tag">القادم: ...</p>
</main></body></html>
